<!DOCTYPE html>
<html>

<head>
    <title>Python Calculator</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e9ecef;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 330px;
            padding: 20px;
            background: #222;
            border-radius: 20px;
            box-shadow: 0 10px 30px #555;
        }

        h2 {
            color: white;
            text-align: center;
            margin-top: 0;
        }

        #display {
            width: 100%;
            height: 65px;
            box-sizing: border-box;
            border: none;
            border-radius: 10px;
            margin-bottom: 15px;
            padding: 10px;
            font-size: 28px;
            text-align: right;
            background: white;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            cursor: pointer;
            background: #444;
            color: white;
        }

        button:hover {
            background: #666;
        }

        .operator {
            background: #ff9500;
        }

        .clear {
            background: #e74c3c;
        }

        .equal {
            background: #27ae60;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h2>PYTHON CALCULATOR</h2>

        <input id="display" value="0" readonly>

        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="backspace()">⌫</button>
            <button class="operator" onclick="operator('%')">%</button>
            <button class="operator" onclick="operator('/')">÷</button>

            <button onclick="number('7')">7</button>
            <button onclick="number('8')">8</button>
            <button onclick="number('9')">9</button>
            <button class="operator" onclick="operator('*')">×</button>

            <button onclick="number('4')">4</button>
            <button onclick="number('5')">5</button>
            <button onclick="number('6')">6</button>
            <button class="operator" onclick="operator('-')">−</button>

            <button onclick="number('1')">1</button>
            <button onclick="number('2')">2</button>
            <button onclick="number('3')">3</button>
            <button class="operator" onclick="operator('+')">+</button>

            <button class="zero" onclick="number('0')">0</button>
            <button onclick="decimal()">.</button>
            <button class="equal" onclick="calculate()">=</button>

            <button class="operator" onclick="operator('**')">xʸ</button>

        </div>
    </div>

    <script>

        let display = document.getElementById("display");

        let firstNumber = null;
        let selectedOperator = null;
        let newNumber = false;


        // Number
        function number(num) {

            if (display.value === "0" || newNumber) {
                display.value = num;
                newNumber = false;
            } else {
                display.value += num;
            }
        }


        // Decimal
        function decimal() {

            if (newNumber) {
                display.value = "0.";
                newNumber = false;
                return;
            }

            if (!display.value.includes(".")) {
                display.value += ".";
            }
        }


        // Operator
        function operator(op) {

            firstNumber = parseFloat(display.value);

            selectedOperator = op;

            newNumber = true;
        }


        // Calculate
        function calculate() {

            if (firstNumber === null || selectedOperator === null) {
                return;
            }

            let secondNumber = parseFloat(display.value);
            let answer;

            switch (selectedOperator) {

                case "+":
                    answer = firstNumber + secondNumber;
                    break;

                case "-":
                    answer = firstNumber - secondNumber;
                    break;

                case "*":
                    answer = firstNumber * secondNumber;
                    break;

                case "/":

                    if (secondNumber === 0) {
                        display.value = "Error";
                        reset();
                        return;
                    }

                    answer = firstNumber / secondNumber;
                    break;

                case "%":

                    if (secondNumber === 0) {
                        display.value = "Error";
                        reset();
                        return;
                    }

                    answer = firstNumber % secondNumber;
                    break;

                case "**":
                    answer = firstNumber ** secondNumber;
                    break;
            }

            if (Number.isInteger(answer)) {
                answer = parseInt(answer);
            }

            display.value = answer;

            firstNumber = null;
            selectedOperator = null;
            newNumber = true;
        }


        // Clear
        function clearDisplay() {

            display.value = "0";
            firstNumber = null;
            selectedOperator = null;
            newNumber = false;
        }


        // Backspace
        function backspace() {

            if (display.value.length > 1) {
                display.value = display.value.slice(0, -1);
            } else {
                display.value = "0";
            }
        }


        // Reset
        function reset() {

            firstNumber = null;
            selectedOperator = null;
            newNumber = true;
        }

    </script>

</body>

</html>
